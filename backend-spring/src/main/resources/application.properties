server.port=8080

spring.application.name=foodorder-backend
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FoodOrderingDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=foodorder_app
spring.datasource.password=FoodOrder@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
